<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fc">
    <title>Sign in | Alex's site</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f7f8fc;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top left, #e9efff 0, transparent 38%), #f7f8fc;
      }
      main { width: min(100%, 430px); }
      .brand { margin: 0 0 18px; text-align: center; color: #53627a; font-size: 14px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
      .card {
        padding: 38px;
        border: 1px solid #e6e9f0;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 22px 70px #25365b14;
      }
      .mark { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto 20px; border-radius: 15px; background: #edf2ff; color: #3559bd; font-size: 22px; font-weight: 800; }
      h1 { margin: 0; text-align: center; font-size: 28px; letter-spacing: -.04em; }
      .intro { margin: 10px 0 28px; color: #69758b; text-align: center; line-height: 1.6; }
      button {
        width: 100%;
        min-height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        border: 1px solid #d8dce5;
        border-radius: 10px;
        background: #fff;
        color: #273247;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        transition: background .15s, border-color .15s, transform .15s;
      }
      button:hover { border-color: #aeb7c8; background: #fafbfe; }
      button:active { transform: translateY(1px); }
      button:focus-visible { outline: 3px solid #95adff; outline-offset: 3px; }
      button:disabled { cursor: wait; opacity: .7; }
      .google-mark { font-size: 20px; font-weight: 800; background: conic-gradient(from -45deg, #4285f4 0 25%, #34a853 0 50%, #fbbc05 0 75%, #ea4335 0); color: transparent; background-clip: text; }
      .account { display: none; margin-top: 22px; text-align: center; }
      .account.visible { display: block; }
      .avatar { width: 58px; height: 58px; border-radius: 50%; object-fit: cover; background: #edf2ff; }
      .email { margin: 12px 0 18px; overflow-wrap: anywhere; font-weight: 650; }
      .secondary { min-height: 42px; color: #53627a; font-size: 14px; }
      .message { min-height: 22px; margin: 16px 0 0; color: #69758b; text-align: center; font-size: 13px; line-height: 1.5; }
      .message.error { color: #b42318; }
      .fine-print { margin: 22px 0 0; color: #8590a2; text-align: center; font-size: 12px; line-height: 1.6; }
      .back { display: block; margin: 22px 0 0; color: #53627a; text-align: center; text-decoration: none; font-size: 14px; }
      .back:hover { color: #3559bd; text-decoration: underline; }
      @media (max-width: 480px) { .card { padding: 30px 22px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Alex's site</p>
      <section class="card" aria-labelledby="title">
        <div class="mark" aria-hidden="true">A</div>
        <h1 id="title">Welcome back</h1>
        <p class="intro">Sign in with your Google account to continue.</p>

        <button id="google-sign-in" type="button">
          <span class="google-mark" aria-hidden="true">G</span>
          <span>Continue with Google</span>
        </button>

        <div id="account" class="account" aria-live="polite">
          <img id="avatar" class="avatar" alt="">
          <p id="email" class="email"></p>
          <button id="sign-out" class="secondary" type="button">Sign out</button>
        </div>
        <p id="message" class="message" role="status">Google sign-in needs Firebase setup. See README.md.</p>
        <p class="fine-print">This demo uses Firebase Authentication. Never enter your Google password on this page.</p>
      </section>
      <a class="back" href="index.html">← Back to the home page</a>
    </main>

    <script type="module">
      // Replace these values with the web app config from Firebase Console.
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        appId: "YOUR_APP_ID"
      };

      const signInButton = document.querySelector("#google-sign-in");
      const signOutButton = document.querySelector("#sign-out");
      const message = document.querySelector("#message");
      const account = document.querySelector("#account");
      const email = document.querySelector("#email");
      const avatar = document.querySelector("#avatar");
      const configured = Object.values(firebaseConfig).every(value => value && !value.startsWith("YOUR_"));

      function showMessage(text, isError = false) {
        message.textContent = text;
        message.classList.toggle("error", isError);
      }

      if (!configured) {
        signInButton.disabled = true;
        showMessage("Add your Firebase web app config to login.html, then enable Google sign-in in Firebase.");
      } else {
        const [{ initializeApp }, { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut }] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js")
        ]);
        const auth = getAuth(initializeApp(firebaseConfig));
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, user => {
          account.classList.toggle("visible", Boolean(user));
          signInButton.hidden = Boolean(user);
          if (user) {
            email.textContent = user.email ?? "Signed in with Google";
            avatar.src = user.photoURL ?? "";
            avatar.hidden = !user.photoURL;
            showMessage("You are signed in.");
          } else {
            showMessage("Choose Google to sign in.");
          }
        });

        signInButton.addEventListener("click", async () => {
          signInButton.disabled = true;
          showMessage("Opening Google sign-in…");
          try {
            await signInWithPopup(auth, provider);
          } catch (error) {
            console.error("Google sign-in failed:", error);
            showMessage("Sign-in did not complete. Check that Google sign-in is enabled and this site domain is authorized in Firebase.", true);
          } finally {
            signInButton.disabled = false;
          }
        });

        signOutButton.addEventListener("click", async () => {
          try {
            await signOut(auth);
          } catch (error) {
            console.error("Sign-out failed:", error);
            showMessage("Could not sign out. Please try again.", true);
          }
        });
      }
    </script>
  </body>
</html>
